name: HTB Challenge Solver

on: 
  push:
  workflow_dispatch: # Bu tugmani bossangiz o'zi ishga tushadi

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Speedrun Script
        # Bu yerda TERM=xterm xatolar chiqishining oldini oladi
        env:
          TERM: xterm
        run: python3 speedrun.py
